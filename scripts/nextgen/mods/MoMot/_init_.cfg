//MoMot是DearMoments的移动模块定义，这里是MoMot的初始化入口
//MoMot的基础移动使用sq_1ms系列的1~4进行定义，可能存在额外的定义
//其对外暴露的绑定命令是+MoMot_bind_forward......
//他们指向另一个命令+MoMot_forward......
//对于需要绕过多绑定的，格式一般为+MoMot_action_forward.... 以action为中间的词缀注册
//socd_f/b/r/l是用于记录移动状态的，他们将会适用于snaptap功能
//针对CS2的特性，当命令无论多么小 都将视为0，因此可以简易实现

alias -multisend_forward
alias -multisend_back
alias -multisend_right
alias -multisend_left
alias +multisend_forward
alias +multisend_back
alias +multisend_right
alias +multisend_left

alias NeedSwitchModeJ2K
alias NeedSwitchModeK2J

//提前注册-命令，适应snaptap
alias -socd_press_f -forward;alias -socd_press_b -back;alias -socd_press_r -right;alias -socd_press_l -left

// --- Forward (W) ---
alias +MoMot_define_forward "move_send_NowInslot;+multisend_forward;alias chk_joy_f +forward;wsadcancel_sma;;+forwardevent;socd_switch_cancel_back;socd_switch_cancel_back;alias +socd_press_f socd_switch_forward;alias antiflash_needback +back;alias Antiflash_recforward recforward_pack;echoln quickstart_w"
// 松开 W 时向控制台打印，触发 C++ 模拟 S
alias -MoMot_define_forward "-multisend_forward;alias chk_joy_f;needstopback;-forwardevent;forward -1009 0 0;;alias +socd_press_f;+socd_press_b;alias antiflash_needback;alias Antiflash_recforward;echoln quickstop_w"
alias +MoMot_action_forward "+MoMot_define_forward;alias sq_1"
alias -MoMot_action_forward "-MoMot_define_forward;alias sq_1"
alias +MoMot_forward "alias sq_1 +MoMot_action_forward"
alias -MoMot_forward "alias sq_1 -MoMot_action_forward"


// --- Back (S) ---
alias +MoMot_define_back "move_send_NowInslot ;+multisend_back;alias chk_joy_b +back;wsadcancel_sma;+backevent;socd_switch_cancel_forward;socd_switch_cancel_forward;alias +socd_press_b socd_switch_back;alias antiflash_needforward +forward;alias Antiflash_recback recback_pack;echoln quickstart_s"
// 松开 S 时触发，C++ 模拟 W
alias -MoMot_define_back "-multisend_back;alias chk_joy_b;needstopforward;-backevent;back -1009 0 0;;alias +socd_press_b;+socd_press_f;alias antiflash_needforward;alias Antiflash_recback;echoln quickstop_s"
alias +MoMot_action_back "+MoMot_define_back;alias sq_2"
alias -MoMot_action_back "-MoMot_define_back;alias sq_2"
alias +MoMot_back "alias sq_2 +MoMot_action_back"
alias -MoMot_back "alias sq_2 -MoMot_action_back"


// --- Right (D) ---
alias +MoMot_define_right  "move_send_NowInslot ;+multisend_right;alias chk_joy_r +right;wsadcancel_sma;+rightevent;socd_switch_cancel_left;socd_switch_cancel_left;alias +socd_press_r socd_switch_right;alias antiflash_needleft +left;alias Antiflash_recright recright_pack;echoln quickstart_a"
// 松开 D 时触发，C++ 模拟 A
alias -MoMot_define_right  "-multisend_right;alias chk_joy_r;;autostop_leftlock;needstopleft;-rightevent;right -1009 0 0;;alias +socd_press_r;+socd_press_l;alias antiflash_needleft;alias Antiflash_recright;echoln quickstop_d"
alias +MoMot_action_right "+MoMot_define_right ;alias sq_3"
alias -MoMot_action_right "-MoMot_define_right ;alias sq_3"
alias +MoMot_right "alias sq_3 +MoMot_action_right"
alias -MoMot_right "alias sq_3 -MoMot_action_right"


// --- Left (A) ---
alias +MoMot_define_left "move_send_NowInslot ;+multisend_left;alias chk_joy_l +left;wsadcancel_sma;+leftevent;socd_switch_cancel_right;socd_switch_cancel_right;alias +socd_press_l socd_switch_left;alias antiflash_needright +right;alias Antiflash_recleft recleft_pack;echoln quickstart_d"
// 松开 A 时触发，C++ 模拟 D
alias -MoMot_define_left "-multisend_left;alias chk_joy_l;needstopright;-leftevent;left -1009 0 0;alias +socd_press_l;+socd_press_r;alias antiflash_needright;alias Antiflash_recleft;echoln quickstop_a"
alias +MoMot_action_left "+MoMot_define_left;alias sq_4"
alias -MoMot_action_left "-MoMot_define_left;alias sq_4"
alias +MoMot_left "alias sq_4 +MoMot_action_left"
alias -MoMot_left "alias sq_4 -MoMot_action_left"

alias sendall_overlayJoy "chk_joy_f;chk_joy_b;chk_joy_r;chk_joy_l"
alias sendall_overlayKey

//移动反向
alias .MoMot_roll ".MoMot_rollforward;.MoMot_rollback;.MoMot_rollright;.MoMot_rollleft"
alias .MoMot_rollforward "alias +MoMot_forward alias sq_2 +MoMot_action_back;alias -MoMot_forward alias sq_2 -MoMot_action_back"
alias .MoMot_rollback "alias +MoMot_back alias sq_1 +MoMot_action_forward;alias -MoMot_back alias sq_1 -MoMot_action_forward"
alias .MoMot_rollright "alias +MoMot_right alias sq_4 +MoMot_action_left;alias -MoMot_right alias sq_4 -MoMot_action_left"
alias .MoMot_rollleft "alias +MoMot_left alias sq_3 +MoMot_action_right;alias -MoMot_left alias sq_3 -MoMot_action_right"

alias .MoMot_recovery ".MoMot_recoveryfb;.MoMot_recoveryrl"
alias .MoMot_recoveryfb "alias +MoMot_forward alias sq_1 +MoMot_action_forward;alias -MoMot_forward alias sq_1 -MoMot_action_forward;alias +MoMot_back alias sq_2 +MoMot_action_back;alias -MoMot_back alias sq_2 -MoMot_action_back;"
alias .MoMot_recoveryrl "alias +MoMot_right alias sq_3 +MoMot_action_right;alias -MoMot_right alias sq_3 -MoMot_action_right;alias +MoMot_left alias sq_4 +MoMot_action_left;alias -MoMot_left alias sq_4 -MoMot_action_left"

exec DearNextgen/scripts/nextgen/mods/MoMot/spacejump/_init_.cfg
//exec DearNextgen/scripts/nextgen/mods/MoMot/autostop/_init_.cfg

alias forwardlock_pack ".autostop_f_disable;alias sq_stuff autostop_forwardlock_start"
alias backlock_pack ".autostop_b_disable;alias sq_stuff autostop_backlock_start"
alias rightlock_pack ".autostop_r_disable;alias sq_stuff autostop_rightlock_start"
alias leftlock_pack ".autostop_l_disable;alias sq_stuff autostop_leftlock_start"



alias +MoMot_Sprint "+sprint;NeedSetMiniMap_Scale"
alias -MoMot_Sprint "-sprint;NeedRecMiniMap_Scale"

exec DearNextgen/scripts/nextgen/mods/MoMot/ApiEvent/RegistermultiSend.cfg
exec DearNextgen/scripts/nextgen/mods/MoMot/FastSprint/_init_.cfg