//------------------------------------------------------------------------
//--------------------------------声音功能相关-----------------------------
//------------------------------------------------------------------------
//这玩意虽然不要钱，但请酌情使用，否则会很喧闹

//DearMoments_RP_KnifeSnd_0            不替换切刀声音
//DearMoments_RP_KnifeSnd_1            替换切刀声音为短剑 [切刀音效替换 *短剑*]
//DearMoments_RP_KnifeSnd_2            替换切刀声音为折刀 [切刀音效替换 *折刀*]
//DearMoments_RP_KnifeSnd_3            替换切刀声音为双匕 [切刀音效替换 *双匕*]
//DearMoments_RP_KnifeSnd_4            替换切刀声音为锯齿 [切刀音效替换 *锯齿*]
//DearMoments_RP_KnifeSnd_5            替换切刀声音为折叠 [切刀音效替换 *折叠刀*]
//DearMoments_RP_KnifeSnd_6            替换切刀声音为博伊 [切刀音效替换 *博伊刀*]
//DearMoments_RP_KnifeSnd_7            替换切刀声音为蝴蝶 [切刀音效替换 *蝴蝶刀*]
DearMoments_RP_KnifeSnd_1


//轻松使用声音提示你开关模块

//DearMoments_SoundTips_Enable         开启声音提示 [输出到音频流]
//DearMoments_SoundTips_Disable        关闭声音提示 [%NULL%]
DearMoments_SoundTips_Enable
