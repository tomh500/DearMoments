//请使用主程序配套的编辑工具编辑本文件，而不是在这里手动编辑

//------------------------------------------------------------------------
//----------------------------开发者模式----------------------------
//------------------------------------------------------------------------
DearMoments_UserMode

//------------------------------------------------------------------------
//-------------------------------输出文本位置------------------------------
//------------------------------------------------------------------------
//下列选项是用于修改文本的输出位置，也就是开关模块信息和输出信息出现的地方
//
//DearMoments_TextOutput_Team      输出到队伍[输出到队伍]
//DearMoments_TextOutput_All       输出到全体[输出到全体]
//DearMoments_TextOutput_Echo      输出到控制台[输出到控制台]
//DearMoments_TextOutput_Null      不输出[不输出]
DearMoments_TextOutput_Echo


//如果你不知道这是什么，请保持禁用
//
//DearMoments_Desubtick_Enable     全局启用Desubtick，使得手感更像CSGO [Desubtick]
//DearMoments_Desubtick_Disable    全局禁用Desubtick，CS2原汁原味手感 [%NULL%]
DearMoments_Desubtick_Enable



//选择滚轮跳模式
//MoMot_MW_A        正常滚轮跳 [%extern A模式%]
//MoMot_MW_B        Desubtick滚轮跳 [%extern B模式%]
//MoMot_MW_C        MouseXY滚轮跳 [%extern C模式%]
//MoMot_MW_D        JumpBug滚轮跳 [%extern D模式%]
MoMot_MW_B


//移动Api
//MoMot_InputMode_key   键盘Api [%extern api:键盘%]
//MoMot_InputMode_JoyPure   摇杆 [%extern api:摇杆%]
//MoMot_InputMode_joySOCD   摇杆SOCD [%extern api:摇杆SOCD%]
//MoMot_InputMode_joySensitivity   摇杆灵敏度[%extern api:摇杆灵敏度%]
//MoMot_InputMode_joySensitivitySOCD   摇杆灵敏度SOCD[%extern api:摇杆灵敏度SOCD%]
MoMot_InputMode_joyPure


//Api发送方式，仅当使用摇杆系列Api才能使用混合Api发送，否则不仅无效，还可能出现BUG
//MoMot_ApiSend_Single     单调发送 [%NULL%]
//MoMot_ApiSend_multi      混合发送 [移动API混合发送]
MoMot_ApiSend_Single




//你可以轻松选择移动方式，随心所欲辅助你的急停

//前后移动方式，在输入Api为摇杆系列，本选项仅修改是否启用半自动急停（双键）
//MoMot_fb_Normal       正常移动 [%NULL%]
//MoMot_fb_SOCD         后覆盖移动 [%extern X轴SOCD%]
//MoMot_fb_Nullbind     单次后覆盖 [%extern X轴Nullbind%]

MoMot_fb_SOCD


//左右移动方式，在输入Api为摇杆系列，本选项仅修改是否启用半自动急停（双键）
//MoMot_rl_Normal       正常移动 [%NULL%]
//MoMot_rl_SOCD         后覆盖移动 [%extern Z轴SOCD%]
//MoMot_rl_Nullbind     单次后覆盖 [%extern Z轴Nullbind%]

MoMot_rl_SOCD



//--------------------------------------------------------------------------

//------------------------------------------------------------------------
//--------------------------------滚轮功能相关-----------------------------
//------------------------------------------------------------------------
//
//你可以分离控制你的上下滚轮绑定，轻松关闭滚轮跳！

//DearMoments_Mwheelup_Jump        上滚轮跳 [上滚轮跳 *%jump->MoMot_MW_A%*]
//DearMoments_Mwheelup_slot        上滚轮切换物品栏 [%NULL%]
DearMoments_Mwheelup_Jump


//DearMoments_Mwheeldown_Jump     下滚轮跳 [下滚轮跳  *%jump->MoMot_MW_A%*]
//DearMoments_Mwheeldown_slot      下滚轮切换物品栏 [%NULL%]
DearMoments_Mwheeldown_Jump

