//请使用主程序配套的编辑工具编辑本文件，而不是在这里手动编辑
alias fps_recovery_cvar fps_max 1009
//------------------------------------------------------------------------
//----------------------------灵敏度相关----------------------------
//------------------------------------------------------------------------

//视角灵敏度
alias MultiSensitivity_MySensitivity sensitivity 0.833

//开火灵敏度
alias MultiSensitivity_MyFireSensitivity sensitivity 0.55

//垂直灵敏度增强
alias MultiSensitivity_Y_scale sensitivity_y_scale 0.7

//水平灵敏度系数
alias MultiSensitivity_MyYaw m_yaw 0.022

//------------------------------------------------------------------------
//----------------------------自定义滚轮行为----------------------------
//------------------------------------------------------------------------

alias DM_Value_CustomWheelUp NULL
alias DM_Value_CustomWheelDown NULL

//------------------------------------------------------------------------
//----------------------------准心跟随颜色设置----------------------------
//------------------------------------------------------------------------

//准心关闭跟随颜色（默认）
alias rec_crosshair_r cl_crosshaircolor_r 102
alias rec_crosshair_g cl_crosshaircolor_g 204
alias rec_crosshair_b cl_crosshaircolor_b 255

//准心开启跟随颜色
alias recoil_crosshair_r cl_crosshaircolor_r 255
alias recoil_crosshair_g cl_crosshaircolor_g 0
alias recoil_crosshair_b cl_crosshaircolor_b 0


//这个旋转数值是180/(m_yaw*你的灵敏度) 一般情况下 m_yaw为0.022 你可以在控制台输入m_yaw获取这个数值
//视角旋转数值，如果需要一键转身，请设置它（以视角灵敏度做计算）
alias spinbot yaw 9822.110662 1 1

//设置你的常规小地图缩放大小 修改下面的浮点数
alias rec_minimap_scale Cl_radar_scale 0.4

如果你在UserSetting开启了自定义滚轮绑定，你需要在下列引号内填写自己的命令
alias mwheelup_custombind_event NULL
alias mwheelup_custombind_event NULL

//------------------------------------------------------------------------
//以下内容为可选设置，不设置不影响你的核心游玩体验，但是部分功能可能无法正常使用

//设置你的准心关闭跟随颜色（默认），更改下面的RGB数值

//设置你的预设灵敏度值（若无需使用快捷灵敏度切换，可无视此处）
alias Superlow_s alias my_sensitivity sensitivity 0.833
alias low_s alias my_sensitivity sensitivity 0.86
alias mid_s alias my_sensitivity sensitivity 1
alias high_s alias my_sensitivity sensitivity 1.05
alias Superhigh_s alias my_sensitivity sensitivity 1.1

//若需要启用快捷灵敏度切换，建议同步设置此处 将8181.818182等设置为计算结果
alias Superlow_r alias spinbot yaw 9822.110662 1 1
alias low_r alias spinbot yaw 9513.742072 1 1
alias mid_r alias spinbot yaw 8181.818182 1 1
alias high_r alias spinbot yaw 7792.207792 1 1
alias Superhigh_r alias spinbot yaw 7438.016529 1 1
